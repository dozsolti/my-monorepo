name: Deploy Zascal Suite

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build applications
        run: |
          bun run --cwd apps/admin build
          bun run --cwd apps/web build

      - name: Assemble deployment
        run: |
          mkdir -p site
          touch index.html 
          echo "<h1>Welcome</h1> <a href='./web'>Web</a> <a href='./admin'>Admin</a>" > index.html

          cp -r apps/admin/dist site/admin
          cp -r apps/web/dist site/web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
